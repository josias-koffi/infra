# Test fixture: legacy compose mode, the stack's own Postgres gets a generated
# password through `generate`.
apiVersion: deploy/v1
name: legacy
mode: compose
compose:
  file: compose.yml
  routes:
    app: { service: app, port: 3000, domain: site }
databases:
  postgres: { type: postgres, service: postgres, database: legacy, user: legacy }
generate: [POSTGRES_PASSWORD]
environments:
  staging:
    externalVolumes: true
    domains: { site: legacy-staging.example.com }
