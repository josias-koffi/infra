apiVersion: deploy/v1
name: shop
apps:
  api:
    image: ghcr.io/example/shop-api
    port: 8080
    domain: site
    uses: [medias, files, mail]
buckets:
  medias: {}
  files: { jurisdiction: default, envPrefix: FILES }
mail: {}
environments:
  staging:
    domains: { site: staging.shop.example.com, blog: blog-staging.example.com }
    emailRouting:
      contact@shop.example.com: me@gmail.com
      Orders@example.com: [me@gmail.com, shop@gmail.com]
