---
# Prepares a remote server that the Dokploy manager deploys to. Docker and the
# base hardening come from the `base` and `docker` roles; Dokploy itself then
# finishes the setup over SSH ("Setup server" in the panel, or the
# dokploy_server resource of platform/).

- name: Require the manager public key
  ansible.builtin.assert:
    that: dokploy_node_public_key | length > 0
    fail_msg: Set DOKPLOY_NODE_PUBLIC_KEY (tofu -chdir=platform output -raw dokploy_node_public_key).

- name: Authorize the Dokploy manager for root
  ansible.posix.authorized_key:
    user: root
    key: "{{ dokploy_node_public_key }}"
    state: present

# Dokploy deploys a private image on a remote node with `docker pull` as root:
# without this login the pull fails with "unauthorized".
- name: Log root in to ghcr.io
  when: ghcr_username | length > 0 and ghcr_token | length > 0
  ansible.builtin.command:
    cmd: docker login ghcr.io --username {{ ghcr_username }} --password-stdin
    stdin: "{{ ghcr_token }}"
  no_log: true
  changed_when: false
