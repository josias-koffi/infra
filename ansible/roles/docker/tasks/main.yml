---
- name: Install Docker dependencies
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
    state: present
    update_cache: true

- name: Ensure Docker keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Check if Docker is already installed
  ansible.builtin.command: docker --version
  register: docker_installed
  changed_when: false
  failed_when: false

- name: Add Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  retries: 3
  delay: 10
  register: docker_gpg_result
  until: docker_gpg_result is succeeded
  when: docker_installed.rc != 0

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
  when: docker_installed.rc != 0

- name: Install Docker CE and plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  when: docker_installed.rc != 0

- name: Create docker systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

# Image pulls over IPv6 reset mid-blob on some hosts: on the civinat node
# (2026-10-18) every deploy failed on "read tcp [2a02:…]->[2606:50c0:…]:443:
# connection reset by peer" from pkg-containers.githubusercontent.com, while
# IPv4 never failed. dockerd's Go resolver ignores gai.conf; with netdns=cgo it
# asks glibc, which honours it (verified on the node), so IPv4 is dialled first.
- name: Prefer IPv4 for host name resolution
  ansible.builtin.lineinfile:
    path: /etc/gai.conf
    line: precedence ::ffff:0:0/96  100
    create: true
    mode: "0644"
    state: "{{ 'present' if docker_prefer_ipv4 else 'absent' }}"

- name: Set the dockerd environment
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/override.conf
    mode: "0644"
    content: |
      [Service]
      # Backward-compat clients (e.g. Traefik).
      Environment=DOCKER_MIN_API_VERSION=1.24
      {% if docker_prefer_ipv4 %}
      # Resolve through glibc so /etc/gai.conf applies (see above).
      Environment=GODEBUG=netdns=cgo
      {% endif %}
  notify: restart docker

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Ensure docker service is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Ensure the admin user can run Docker
  ansible.builtin.user:
    name: "{{ node_admin_user }}"
    groups: docker
    append: true
    state: present
