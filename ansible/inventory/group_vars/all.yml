---
# Non-root admin account created on every server (sudo + docker).
node_admin_user: "{{ lookup('env', 'NODE_ADMIN_USER') | default('devops', true) }}"

# Keys allowed to log in as node_admin_user.
ssh_public_keys:
  - "{{ lookup('file', lookup('env', 'OPERATOR_SSH_PUBLIC_KEY_FILE') | default('~/.ssh/id_ed25519.pub', true)) }}"

security_ufw_allowed_tcp_ports: ["22", "80", "443"]

# Swap size in MB (0 = none).
swap_size_mb: "{{ lookup('env', 'SWAP_SIZE_MB') | default('0', true) | int }}"
