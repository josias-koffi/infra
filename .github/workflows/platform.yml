name: Platform

on:
  pull_request:
    paths: [platform/**, modules/**, apps/**, schema/**, scripts/**, examples/**, ansible/**]
  push:
    branches: [main]
    paths: [platform/**]
  workflow_dispatch:

permissions:
  contents: read

env:
  TOFU_VERSION: 1.12.3

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with: { tofu_version: "${{ env.TOFU_VERSION }}", tofu_wrapper: false }
      - run: pip install --quiet jsonschema pyyaml ansible-core
      - name: Manifests
        run: scripts/validate-manifest.py examples/*/.deploy/manifest.yaml
      - name: Module tests (mocked provider)
        run: |
          cd modules/dokploy-app
          tofu init -backend=false -input=false
          tofu test
      - name: Validate roots
        run: |
          for d in platform apps/project apps/env; do
            tofu -chdir=$d init -backend=false -input=false >/dev/null
            tofu -chdir=$d validate
          done
          tofu fmt -check -recursive
      - name: Ansible syntax
        run: |
          ansible-galaxy collection install ansible.posix community.general >/dev/null
          cp ansible/inventory/hosts.example ansible/inventory/hosts
          ansible-playbook --syntax-check ansible/playbooks/setup-manager.yml ansible/playbooks/add-node.yml

  platform:
    needs: checks
    # Off until the secrets are set (docs/getting-started/fresh-install.md, step 8): repo variable PLATFORM_ENABLED=true.
    if: vars.PLATFORM_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || '' }}
    env:
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      TF_VAR_dokploy_endpoint: ${{ vars.DOKPLOY_URL }}
      TF_VAR_r2_backup_buckets: '{"production":"${{ vars.R2_BACKUP_BUCKET_PROD }}","staging":"${{ vars.R2_BACKUP_BUCKET_STAGING }}"}'
      AWS_ENDPOINT_URL_S3: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_r2_endpoint: ${{ secrets.R2_ENDPOINT }}
      TF_VAR_r2_backup_credentials: >-
        {"production":{"access_key":"${{ secrets.R2_BACKUP_PROD_ACCESS_KEY_ID }}","secret_access_key":"${{ secrets.R2_BACKUP_PROD_SECRET_ACCESS_KEY }}"},
         "staging":{"access_key":"${{ secrets.R2_BACKUP_STAGING_ACCESS_KEY_ID }}","secret_access_key":"${{ secrets.R2_BACKUP_STAGING_SECRET_ACCESS_KEY }}"}}
      TF_VAR_ghcr_username: ${{ vars.GHCR_USERNAME }}
      TF_VAR_ghcr_token: ${{ secrets.GHCR_TOKEN }}
      TF_VAR_node_ssh_public_key: ${{ vars.NODE_SSH_PUBLIC_KEY }}
      TF_VAR_node_ssh_private_key: ${{ secrets.NODE_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with: { tofu_version: "${{ env.TOFU_VERSION }}", tofu_wrapper: false }
      - run: tofu -chdir=platform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: Plan
        run: tofu -chdir=platform plan -input=false -out=tfplan
      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tofu -chdir=platform apply -input=false tfplan
