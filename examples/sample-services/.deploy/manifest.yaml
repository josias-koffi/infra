# yaml-language-server: $schema=https://raw.githubusercontent.com/josias-koffi/infra/main/schema/manifest.v1.json
# Reference manifest for a NEW app: one Dokploy service per component.
apiVersion: deploy/v1
name: sample
server: vps20
mode: services

# Only what a human must give goes in `secrets`; infra generates the rest.
secrets: [ADMIN_EMAIL]
generate: [SESSION_SECRET]            # created once per environment, kept in its state
# Database and cache passwords (DB_PASSWORD, CACHE_PASSWORD) are generated too.

apps:
  web:
    image: ghcr.io/josias-koffi/sample-web
    port: 3000
    domain: web
    uses: [api]                       # API_URL=https://<api domain>
    resources: { cpus: 0.5, memory: 512m }
    secrets: [SESSION_SECRET]         # this app only sees these secrets (typed or generated)
  api:
    image: ghcr.io/josias-koffi/sample-api
    port: 8080
    domain: api
    uses: [db, cache, files, mail]    # DATABASE_URL, REDIS_URL, S3_*, RESEND_API_KEY + SMTP_*
    volumes: { uploads: /app/uploads } # <volumePrefix>_uploads, backed up daily
    resources: { cpus: 1, memory: 1g }
workers:
  jobs:
    image: ghcr.io/josias-koffi/sample-api
    command: node
    args: [dist/worker.js]
    uses: [db, cache]
    resources: { memory: 256m }

databases:
  db: { type: postgres, version: 16-alpine, database: sample, user: sample, resources: { memory: 512m } }
caches:
  cache: { type: redis, version: 7-alpine }

buckets:
  files: {}                           # R2 bucket sample-<env>-files, EU jurisdiction, copied nightly
mail: {}                              # Resend key limited to the zone of the env's first domain

environments:
  production:
    branch: main
    deploy: manual                    # a push on main never deploys: run the workflow by hand
    domains: { web: sample.example.com, api: sample-api.example.com }
    emailRouting:
      contact@example.com: owner@example.net   # Cloudflare Email Routing
  staging:
    branch: develop                   # deploy: auto (default): every push on develop deploys
    domains: { web: sample-staging.example.com, api: sample-api-staging.example.com }
    overrides:
      apps: { api: { resources: { memory: 512m } } }
