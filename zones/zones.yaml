# What belongs to a domain rather than to an app (zones/main.tf).
# DNS of the apps themselves needs nothing here: any zone of the Cloudflare
# account works from the manifest alone.

# Sending domains (Resend). One line per domain an app sends mail from; each
# app/env then gets its own key with `mail: {}` in its manifest.
#   region      eu-west-1 (default) | us-east-1 | sa-east-1 | ap-northeast-1
#   returnPath  subdomain of the bounce address (default send)
#   dmarc       DMARC policy written when the domain has none (default p=none)
#   resendId    rarely needed: a domain already in Resend is found by its name
#               and adopted as it is (never created twice nor replaced)
# The records Resend asks for are created in the domain's zone, unless another
# owner already holds them (then they are left alone and listed).
mail:
  ouiti.com: {}

# Email Routing is turned on in every zone of the account whose apex has no
# mail setup of its own (no foreign MX or SPF); the others are listed in the
# output email_routing_skipped. Forwarding rules come from the manifests
# (environments.<env>.emailRouting). To keep a zone out:
# emailRouting:
#   exclude: [example.com]
