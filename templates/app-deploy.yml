# Deploy workflow of an app repo — copy to .github/workflows/deploy.yml.
# No rule lives here: which branch deploys which environment, and whether a push
# deploys or only a manual run does, come from .deploy/manifest.yaml
# (environments.<env>.branch / deploy: auto|manual). Guide: docs/guides/deploy-an-app.md
#
# The deploy itself runs in the infra repo (deploy-app.yml): this repo holds no
# platform credential, only the token that starts it.
#
# Repo secret : INFRA_DEPLOY_TOKEN (scripts/onboard-app.sh, in infra)
# App secrets : the manifest's `secrets`, in the infra environments <app>-<env>
#               (scripts/init-app-env.sh, in infra)
name: Deploy

on:
  push:                 # every push asks the manifest; most end after ~10 s
  workflow_dispatch:
    inputs:
      environment:
        description: Environment (empty = the one of this branch)
        required: false
      image_tag:
        description: Existing image tag to deploy (promote / roll back) — empty builds this commit
        required: false
      plan_only:
        description: Only show the plan
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    uses: josias-koffi/infra/.github/workflows/resolve.yml@main
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ inputs.image_tag }}

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One build-push step per image of the manifest.
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/CHANGE-ME:${{ needs.resolve.outputs.image_tag }}

  deploy:
    needs: [resolve, build]
    if: ${{ !failure() && !cancelled() && needs.resolve.outputs.deploy == 'true' }}
    uses: josias-koffi/infra/.github/workflows/dispatch-deploy.yml@main
    with:
      environment: ${{ needs.resolve.outputs.environment }}
      image_tag: ${{ needs.resolve.outputs.image_tag }}
      plan_only: ${{ inputs.plan_only == true }}
    secrets:
      INFRA_DEPLOY_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
